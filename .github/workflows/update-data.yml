# Every morning: fetch new data from EPİAŞ, add it to the processed files, commit it to main,
# then build the site and publish it. One workflow does all of it because a commit made with the
# built-in token does not start the "Publish site" workflow.
#
# This repository is private. The rendered site (HTML only) is pushed to the public repository
# mervebozkurt35/trpowerlab-site, which GitHub Pages serves at trpowerlab.com. Needs the secret SITE_DEPLOY_TOKEN.
#
# If a series fails, its old rows stay in place, the rest of the data is still committed and published,
# and the run is marked as failed at the end so GitHub sends an email.
name: Update data and publish

on:
  schedule:
    - cron: "37 3 * * *"        # 06:37 Istanbul time (UTC+3 all year), every day
  workflow_dispatch:
    inputs:
      write:
        description: "Commit the new data and publish the site (untick for a trial that changes nothing)"
        type: boolean
        default: true
      mode:
        description: "How far back to rewrite (auto: last 2 months on the 1st, last 7 days on Mondays, only the new day otherwise)"
        type: choice
        options: [auto, daily, weekly, monthly, deep]
        default: auto

permissions:
  contents: write               # push the data commit

concurrency:
  group: pages                  # shares the lock with "Publish site": never two publishes at once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      update: ${{ steps.update.outcome }}
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Fetch new data from EPİAŞ and merge it into data/processed
        id: update
        continue-on-error: true            # the commit, build and publish below still run with whatever was updated
        env:
          EPTR_USERNAME: ${{ secrets.EPTR_USERNAME }}
          EPTR_PASSWORD: ${{ secrets.EPTR_PASSWORD }}
          MODE_INPUT: ${{ inputs.mode }}
          PYTHONUNBUFFERED: "1"          # show the log while the step runs
        run: python scripts/update_data.py --mode "${MODE_INPUT:-auto}"

      - name: Build the overview of the latest day
        if: always()
        env:
          TRIAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.write }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          FLAG=""
          if [ "$TRIAL" = "true" ]; then FLAG="--trial"; fi
          python scripts/daily_digest.py --out _digest --update-outcome "$UPDATE_OUTCOME" $FLAG
          { echo "## Overview of the latest day"; echo; echo '```'; cat _digest/digest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the overview for the mail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: _digest
          if-no-files-found: ignore

      - name: Commit the new data to main
        if: github.event_name != 'workflow_dispatch' || inputs.write
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            THROUGH=$(jq -r '.data_through["core_daily.csv"] // "unknown"' data/processed/update_status.json 2>/dev/null || echo unknown)
            git commit -m "Data update: prices through $THROUGH"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Install Quarto
        if: github.event_name != 'workflow_dispatch' || inputs.write
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the site
        if: github.event_name != 'workflow_dispatch' || inputs.write
        run: quarto render

      - name: Keep the rendered site for the publish job
        if: github.event_name != 'workflow_dispatch' || inputs.write
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.write
    runs-on: ubuntu-latest
    steps:
      - name: Get the rendered site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish the rendered site to the public repository
        env:
          SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          SITE_REPO: mervebozkurt35/trpowerlab-site
          SITE_DOMAIN: trpowerlab.com
        run: |
          set -e
          if [ -z "$SITE_TOKEN" ]; then echo "::error::The secret SITE_DEPLOY_TOKEN is missing."; exit 1; fi
          cd _site
          touch .nojekyll
          echo "$SITE_DOMAIN" > CNAME
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u '+%Y-%m-%d %H:%M') UTC"
          git remote add origin "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git"
          git push --force origin main        # one commit only: the public repository never keeps a history

  # Sends the overview of the latest day by e-mail once the site is published (or straight away in a trial run).
  # Needs the secrets MAIL_USERNAME and MAIL_APP_PASSWORD (and optionally MAIL_TO); without them it does nothing.
  notify:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install pandas

      - name: Get the overview
        uses: actions/download-artifact@v4
        with:
          name: digest
          path: _digest
        continue-on-error: true

      - name: Send the e-mail
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TRIAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.write }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ ! -f _digest/digest.txt ]; then echo "::warning::No overview was built, so no mail is sent."; exit 0; fi
          FLAG=""
          if [ "$TRIAL" = "true" ]; then FLAG="--trial"; fi
          python scripts/daily_digest.py --send-only --out _digest --deploy "$DEPLOY" $FLAG

  # Runs last. The site is already published with the good data; this only turns the run red when the update had problems.
  report:
    needs: [build, deploy]
    if: ${{ always() && needs.build.outputs.update == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark the run as failed
        run: |
          echo "::error::The data update had errors. See the job summary of the build job for the list of files and messages."
          exit 1
