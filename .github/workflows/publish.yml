# Builds the Quarto site on every push to main and publishes the rendered HTML to the public repository
# mervebozkurt35/trpowerlab-site, which GitHub Pages serves at trpowerlab.com. This repository stays private.
# Needs the secret SITE_DEPLOY_TOKEN.
name: Publish site

on:
  push:
    branches: [main]      # run after every change on the main branch
  workflow_dispatch:      # also allows a manual run from the Actions tab

permissions:
  contents: read          # read the repository

concurrency:
  group: pages            # never run two publishes at once
  cancel-in-progress: false   # a publish is never cancelled by a newer commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render the site
        run: quarto render

      - name: Keep the rendered site for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get the rendered site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish the rendered site to the public repository
        env:
          SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          SITE_REPO: mervebozkurt35/trpowerlab-site
          SITE_DOMAIN: trpowerlab.com
        run: |
          set -e
          if [ -z "$SITE_TOKEN" ]; then echo "::error::The secret SITE_DEPLOY_TOKEN is missing."; exit 1; fi
          cd _site
          touch .nojekyll
          echo "$SITE_DOMAIN" > CNAME
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u '+%Y-%m-%d %H:%M') UTC"
          git remote add origin "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git"
          git push --force origin main        # one commit only: the public repository never keeps a history

